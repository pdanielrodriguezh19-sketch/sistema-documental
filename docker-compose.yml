version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sistema_documental
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data: